# GitLab CI/CD pipeline for ticketquality-audit
#
# Stages
#   lint      : static analysis + formatting checks
#   test      : pytest with a hard coverage gate (>88%)
#   build     : wheel + container image
#   release   : publish artefacts on tags
#
# LightGBM's native library needs libgomp1, which is installed in
# `before_script` for every job that imports the package.

stages:
  - lint
  - test
  - build
  - release

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  COVERAGE_THRESHOLD: "88"

default:
  image: python:3.11-slim
  cache:
    key:
      files:
        - pyproject.toml
    paths:
      - .cache/pip
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends libgomp1 git
    - python -m venv .venv
    - source .venv/bin/activate
    - pip install --upgrade pip
    - pip install -e ".[dev]"
    - pip install ruff black

# --------------------------------------------------------------------------- #
# lint
# --------------------------------------------------------------------------- #
ruff:
  stage: lint
  script:
    - ruff check src tests scripts
  allow_failure: false

black:
  stage: lint
  script:
    - black --check --diff src tests scripts
  allow_failure: true

# --------------------------------------------------------------------------- #
# test
# --------------------------------------------------------------------------- #
pytest:
  stage: test
  script:
    - >
      pytest
      --cov=src/ticketquality
      --cov-report=term-missing
      --cov-report=xml:coverage.xml
      --cov-report=html:htmlcov
      --junitxml=report.xml
      -q
  coverage: '/^TOTAL.+?(\d+\%)$/'
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - coverage.xml
      - htmlcov/
      - report.xml
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

coverage-gate:
  stage: test
  needs: ["pytest"]
  script:
    - source .venv/bin/activate
    - |
      python - <<'PY'
      import sys, xml.etree.ElementTree as ET
      tree = ET.parse("coverage.xml")
      rate = float(tree.getroot().get("line-rate", 0)) * 100
      threshold = float("${COVERAGE_THRESHOLD}")
      print(f"Coverage: {rate:.2f}% (threshold {threshold:.0f}%)")
      sys.exit(0 if rate >= threshold else 1)
      PY
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

smoke-test:
  stage: test
  needs: []
  script:
    - source .venv/bin/activate
    - python scripts/generate_audit_dataset.py --samples 400 --output data/smoke.csv
    - ticketquality train --data data/smoke.csv --model-out artifacts/smoke.joblib
    - ticketquality audit --file examples/sample_tickets.csv --output artifacts/smoke_report.json
    - ticketquality explain --ticket-id "$(head -2 examples/sample_tickets.csv | tail -1 | cut -d, -f1)" --file examples/sample_tickets.csv
    - python -c "import json;json.load(open('artifacts/smoke_report.json'));print('report OK')"
  artifacts:
    when: on_success
    expire_in: 1 day
    paths:
      - artifacts/

# --------------------------------------------------------------------------- #
# build
# --------------------------------------------------------------------------- #
build-wheel:
  stage: build
  needs: ["pytest"]
  script:
    - source .venv/bin/activate
    - pip install build
    - python -m build --wheel --outdir dist/
  artifacts:
    expire_in: 1 month
    paths:
      - dist/*.whl
  rules:
    - if: $CI_COMMIT_BRANCH

build-image:
  stage: build
  needs: ["pytest"]
  image: docker:24-cli
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script: []
  script:
    - docker build --pull -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" .
    - docker tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" "$CI_REGISTRY_IMAGE:latest"
    - |
      if [ -n "$CI_REGISTRY_USER" ]; then
        echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
        docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
        docker push "$CI_REGISTRY_IMAGE:latest"
      else
        echo "No registry credentials; skipping push."
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# --------------------------------------------------------------------------- #
# release
# --------------------------------------------------------------------------- #
publish:
  stage: release
  needs: ["build-wheel"]
  script:
    - echo "Publishing ticketquality-audit for tag $CI_COMMIT_TAG"
    - ls -la dist/
  artifacts:
    paths:
      - dist/*.whl
  rules:
    - if: $CI_COMMIT_TAG
      when: on_success
