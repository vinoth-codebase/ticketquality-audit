[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ticketquality-audit"
version = "1.0.0"
description = "Premature closure & re-open risk forecaster for software support tickets"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vinothkumar N", email = "vinothofficial14@gmail.com" }]
keywords = [
    "itsm",
    "support-quality",
    "machine-learning",
    "lightgbm",
    "shap",
    "streamlit",
    "reopen-risk",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Office/Business",
]

dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "lightgbm>=4.0",
    "shap>=0.44",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "click>=8.1",
    "rich>=13.7",
    "joblib>=1.3",
    "streamlit>=1.30",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "tabulate>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-mock>=3.12",
]

[project.urls]
Homepage = "https://github.com/vinothkumar-n/ticketquality-audit"
Repository = "https://github.com/vinothkumar-n/ticketquality-audit"
Issues = "https://github.com/vinothkumar-n/ticketquality-audit/issues"

[project.scripts]
ticketquality = "ticketquality.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["ticketquality*"]

[tool.setuptools.package-data]
ticketquality = ["py.typed"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.coverage.run]
source = ["src/ticketquality"]
branch = true
omit = [
    "*/__init__.py",
    "*/dashboard/app.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    'if __name__ == .__main__.:',
    '\.\.\.',
]
fail_under = 88
show_missing = true

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008"]
